services:
  - type: web
    name: roadbook-api
    runtime: python
    rootDir: backend
    buildCommand: pip install -r requirements.txt && python manage.py collectstatic --noinput && python manage.py migrate && python manage.py seed_demo
    startCommand: gunicorn eld.wsgi:application
    healthCheckPath: /health/
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.8
      - key: DJANGO_DEBUG
        value: "false"
      - key: DJANGO_SECRET_KEY
        generateValue: true
      - key: DJANGO_ALLOWED_HOSTS
        value: .onrender.com
      - key: DATABASE_URL
        fromDatabase:
          name: roadbook-db
          property: connectionString
      - key: CORS_ALLOWED_ORIGINS
        value: https://road-book-rouge.vercel.app
      - key: DJANGO_CSRF_TRUSTED_ORIGINS
        value: https://road-book-rouge.vercel.app
      - key: ORS_API_KEY
        sync: false
      # Passwords used by `manage.py seed_demo` for newly created accounts.
      # Existing accounts keep whatever password they already have.
      - key: SEED_ADMIN_PASSWORD
        sync: false
      - key: SEED_DRIVER_PASSWORD
        sync: false

databases:
  - name: roadbook-db
    databaseName: roadbook
    user: roadbook
    plan: free